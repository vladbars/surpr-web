worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 1m;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Personal card URLs and checkout query parameters do not belong in access logs.
    log_format minimal '$request_id $request_method $status $body_bytes_sent $request_time';
    access_log /dev/stdout minimal;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    map $uri $cache_control {
        default "no-cache";
        ~^/assets/ "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header Cache-Control $cache_control;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # A stale/missing JS chunk must return 404 rather than HTML.
        location /assets/ {
            try_files $uri =404;
        }

        location /audio/ {
            try_files $uri =404;
        }

        # The API is a separate Coolify application at api.surpr.link.
        location /api/ {
            return 404;
        }

        location ~* \.(?:css|js|mjs|map|json|svg|png|ico|jpe?g|webp|gif|avif|woff2?|ttf|mp3|m4a|ogg|wav)$ {
            try_files $uri =404;
        }

        # Serve the application shell for client-side routes and direct navigation.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
